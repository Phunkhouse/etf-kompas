# Publishes the two design documents (docs/design/wireframes) and a small index page to
# GitHub Pages. Only the design files: the app itself is on Vercel. Needs
# Settings > Pages > Source: GitHub Actions, once.
name: Design pages
on:
  push:
    branches: [main]
    paths:
      - docs/design/wireframes/etf-kompas-board.html
      - docs/design/wireframes/etf-kompas-design-study.html
      - docs/design/pages/**
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          mkdir _site
          cp docs/design/pages/index.html _site/index.html
          cp docs/design/wireframes/etf-kompas-design-study.html _site/design-study.html
          cp docs/design/wireframes/etf-kompas-board.html _site/wireframe-board.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

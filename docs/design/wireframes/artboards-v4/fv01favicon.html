body{margin:0;background:#F6F3EC;color:#16150F;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:16px;line-height:1.45}
*{box-sizing:border-box}
h1,h2,h3,p{margin:0}
.tag{font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#6B665A}
.tag.g{display:inline-block;background:#C23A1B;color:#fff;padding:5px 8px;border-radius:3px}
.btn{display:flex;width:100%;align-items:center;justify-content:center;min-height:56px;padding:0 20px;background:#16150F;color:#F6F3EC;font:600 17px 'IBM Plex Sans',sans-serif;border:0;border-radius:6px;text-decoration:none}
.chip{min-height:48px;min-width:56px;padding:0 16px;border:1.5px solid #16150F;border-radius:999px;background:transparent;font:500 16px 'IBM Plex Sans',sans-serif;color:#16150F}
.chip.on{background:#16150F;color:#F6F3EC}
.dk .chip{border-color:#F6F3EC;color:#F6F3EC}
.dk .chip.on{background:#F6F3EC;color:#16150F}
.ph{background:repeating-linear-gradient(135deg,#E6E1D4 0 8px,#ECE8DC 8px 16px);border:1px dashed #B5AE9C;color:#6B665A}
.card{background:#FFFDF8;border:1px solid #D4CEBE;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
input[type=email]{width:100%;min-height:56px;padding:0 14px;border:1.5px solid #16150F;border-radius:6px;background:#fff;font:400 17px 'IBM Plex Sans',sans-serif;color:#16150F}
input[type=range]{width:100%;accent-color:#F6F3EC;margin:6px 0}
.row{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.7fr) minmax(0,.9fr);gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #D4CEBE;font-size:14px}
.pill{padding:4px 8px;border-radius:999px;font-size:13px;font-weight:500;justify-self:start;white-space:nowrap}
.no{background:#F4D9D1;color:#7A2410}
.yes{background:#D6E8DE;color:#154A33}
.ver{background:#F3E6BE;color:#6B4E00}
a{color:#16150F}
.ver{background:#F3E6BE;color:#6B4E00}.sw{width:48px;height:28px;border-radius:99px;background:#6B665A;position:relative;flex:none}.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff}.sw.on{background:#2F6B49}.sw.on::after{left:23px}.sw.lock{background:#2F6B49}.sw.lock::after{left:23px}
